
general {
    hide_cursor = true
}

background {
    # 锁屏背景 = 当前桌面的截图（自动模糊），不再用发行版自带的那张 wall1.png，
    # 这样换壁纸后锁屏会跟着变，视觉一致。
    # 取不到截图时（例如 screencopy 权限被拒）自动退回下面的 color 纯色底。
    # 相关：hyprland.lua 的 PERMISSIONS 段已放行 hyprlock 的 screencopy 权限。
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.85
    color = rgba(25, 20, 20, 1.0)
}

input-field {
    size = 300, 50
    font_color = rgb(10, 10, 10)
    placeholder_text = 请输入密码
    fail_text = 密码验证失败 
}

label {
    text = $TIME
    font_size = 65
    position = 0, 100
}

