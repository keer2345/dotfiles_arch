
general {
    hide_cursor = true
}

background {
    # 锁屏背景 = Hyprland 自带的 wall1.png
    # （/usr/share/hypr/ 下另有 wall0.png、wall2.png 可换）
    # 不用 path = screenshot：那张是当前桌面的实时截图，会跟着桌面内容变化。
    # 换成自带图后外观是稳定的，也不再依赖 hyprlock 的 screencopy 权限。
    path = /usr/share/hypr/wall1.png
    # 这张图本身是深灰底 + 青绿三角碎片，白色时间与密码框的对比已经够，
    # 因此不做模糊、不压暗，保持原图样貌。
    # （想要柔和一点可以加 blur_passes = 1 / blur_size = 2，别调太大，糊了就看不出来了）
    brightness = 1.0
    # 图片加载失败时的兜底底色
    color = rgba(25, 20, 20, 1.0)
}

input-field {
    size = 300, 50
    font_color = rgb(10, 10, 10)
    placeholder_text = 请输入密码
    fail_text = 密码验证失败 
}

label {
    text = $TIME
    font_size = 65
    position = 0, 100
}

