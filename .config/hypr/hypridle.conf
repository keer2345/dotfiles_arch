# hypridle 配置（注意：hypridle 用的是 hyprlang，不是 hyprland.lua 那套 Lua 语法）
# 文档：https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# 重要修正：官方样例用 `loginctl lock-session` 来锁屏，但 Hyprland 0.57 的二进制里
# 完全没有 org.freedesktop.login1 相关符号（strings 检索为 0），logind 发出的 Lock
# 信号不会启动 hyprlock —— 照抄样例的结果就是「到点了但屏幕一点反应都没有」。
# 所以这里全部改成直接调用 hyprlock。
#
# timeout 单位是「秒」，不是分钟。
#
# 时间线（空闲后）：
#   480s   → 内屏背光降到 10% + 键盘背光关闭
#   1200s  → 锁屏，同时关显示器（两条独立 listener，同一时刻触发）
#   36000s → 挂起
#
# 注意：hyprlock 本身和 DPMS 开关都【不】改背光寄存器（已实测 65535→65535→65535），
# 唯一改背光的就是下面 480s 那条 brightnessctl。

general {
    # 锁屏命令；pidof 保证不会同时跑多个实例
    lock_cmd = pidof hyprlock || hyprlock

    # 休眠前锁屏：--immediate-render 提前把锁屏画出来（避免唤醒时闪一下桌面）
    # --grace 0 表示不再给宽限期，唤醒即要求认证
    before_sleep_cmd = pidof hyprlock || hyprlock --immediate-render --grace 0

    # 唤醒后把屏幕点亮（否则可能出现「唤醒但黑屏，要按键才亮」）
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 8 分钟：内屏背光降到 10%
# 不用 brightnessctl 的 -s/-r，改用 scripts/idle-backlight.sh，原因：
#   -r 读的保存文件在 hypridle 重启后不会消失，若重启时正处于「已调暗」状态，
#   -s 会把 10% 写进去，此后 -r 就永远恢复到 10%（亮度再也回不去）；
#   而且 -r 在没有保存文件时退出码是 0，`-r || set 100%` 这种兜底不会触发。
# 脚本只在当前亮度高于调暗目标时才记录原值，从根本上避免这个污染。
listener {
    timeout = 480
    on-timeout = /home/keer/.config/hypr/scripts/idle-backlight.sh dim
    on-resume = /home/keer/.config/hypr/scripts/idle-backlight.sh restore
}

# 8 分钟：键盘背光关掉（本机 LED 名是 platform::kbd_backlight）
# 同样走脚本：目标值 0，避免「已关状态下再记录 0」导致恢复后一直是灭的。
listener {
    timeout = 480
    on-timeout = /home/keer/.config/hypr/scripts/idle-backlight.sh dim platform::kbd_backlight 0
    on-resume = /home/keer/.config/hypr/scripts/idle-backlight.sh restore platform::kbd_backlight
}

# 20 分钟：锁屏
# 单独一条，不再和关屏混在同一个 on-timeout 里 —— hyprlock 是前台阻塞进程，
# 用 `;` 串在它后面的命令要等解锁才会执行，锁屏也就永远不会关屏。
listener {
    timeout = 1200
    on-timeout = pidof hyprlock || hyprlock
}

# 20 分钟：关显示器（与锁屏同一时刻，消除之前「屏幕黑着但没锁」的 10 分钟空窗）
# 保留 hyprlock 在跑，唤醒后直接是锁屏界面。
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 600 分钟：挂起
# 如果经常在后台跑编译/下载，可以把这段注释掉，或把 timeout 调到 3600
listener {
    timeout = 36000
    on-timeout = systemctl suspend
}
